    catalog: motor-muscle-sim
    repository: git@gitlab.com:reachievellc/service-backend.git
    catalogPath: catalogs/motor-muscle-sim/modules/motor-muscle-sim
    submodulePath: catalogs/motor-muscle-sim/modules/motor-muscle-sim/source
